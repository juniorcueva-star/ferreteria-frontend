<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo Bonifaz & Cia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Visor oscuro tipo "modo presentacion": la pantalla del sistema al centro, controles arriba. Un solo tema a proposito. */
  --fondo: #141414;
  --panel: #1f1f1f;
  --borde: #333230;
  --texto: #f2f1ee;
  --suave: #a8a6a0;
  --amarillo: #f5c400;
  --fuente-titulo: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --fuente: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 15px/1.45 var(--fuente); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--borde); }
.marca { display: flex; flex-direction: column; min-width: 0; }
.marca strong { font: 800 18px/1.1 var(--fuente-titulo); letter-spacing: .01em; }
.marca span { font-size: 12px; color: var(--suave); }
.roles { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--borde); border-radius: 10px; }
.roles button { font: 600 14px var(--fuente); color: var(--suave); background: none; border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer; }
.roles button[aria-pressed="true"] { background: var(--amarillo); color: #111; }
.roles button:hover:not([aria-pressed="true"]) { color: var(--texto); }
.navegar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.navegar button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--borde); background: none; color: var(--texto); font-size: 18px; cursor: pointer; }
.navegar button:hover { border-color: var(--amarillo); }
select { font: 500 14px var(--fuente); color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 10px; max-width: 260px; }
label.zonas { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); cursor: pointer; }
input[type="checkbox"] { accent-color: var(--amarillo); }
:focus-visible { outline: 2px solid var(--amarillo); outline-offset: 2px; }
main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; }
.pantalla { position: relative; width: min(100%, calc((100vh - 150px) * 1.6)); aspect-ratio: 1440 / 900; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.55); background: #fff; }
.pantalla img { display: block; width: 100%; height: 100%; }
.zona { position: absolute; border: 0; padding: 0; background: transparent; border-radius: 6px; cursor: pointer; }
.zona:hover, .zona:focus-visible, .mostrar .zona { box-shadow: inset 0 0 0 2px var(--amarillo); background: rgba(245, 196, 0, .16); }
.destello .zona { animation: destello .7s ease-out; }
@keyframes destello { from { background: rgba(245, 196, 0, .45); box-shadow: inset 0 0 0 2px var(--amarillo); } to { background: transparent; box-shadow: none; } }
footer { padding: 0 20px 12px; font-size: 12px; color: var(--suave); text-align: center; }
@media (prefers-reduced-motion: reduce) { .destello .zona { animation: none; } }
@media (max-width: 700px) { header { padding: 10px 16px; } .navegar { margin-left: 0; width: 100%; } select { flex: 1; max-width: none; } main { padding: 10px 16px; } }
</style>
</head>
<body>
<header>
  <div class="marca"><strong>Bonifaz &amp; Cia · Prototipo</strong><span>Sistema de ventas, inventario y caja · Pernos y afines</span></div>
  <div class="roles" role="group" aria-label="Recorrido">
    <button type="button" data-rol="dueno">Dueño</button>
    <button type="button" data-rol="vendedor">Vendedor</button>
    <button type="button" data-rol="almacenero">Almacenero</button>
  </div>
  <div class="navegar">
    <button type="button" id="anterior" aria-label="Pantalla anterior">‹</button>
    <select id="lista" aria-label="Ir a una pantalla"></select>
    <button type="button" id="siguiente" aria-label="Pantalla siguiente">›</button>
    <label class="zonas" for="verZonas"><input type="checkbox" id="verZonas"> Ver botones</label>
  </div>
</header>
<main>
  <div class="pantalla" id="pantalla">
    <img id="imagen" alt="">
  </div>
</main>
<footer>Haz clic en los botones de la pantalla para navegar (los clicables se resaltan en amarillo). Capturas del sistema real; las respuestas del asistente de IA son de ejemplo.</footer>

const INICIO = { dueno: '01-inicio-de-sesion', vendedor: '20-vendedor-inicio', almacenero: '40-almacenero-inicio' };
const porId = Object.fromEntries(PANTALLAS.map((p) => [p.id, p]));
const marco = document.getElementById('pantalla');
const imagen = document.getElementById('imagen');
const lista = document.getElementById('lista');
let actual = null;

function delRol(rol) { return PANTALLAS.filter((p) => p.rol === rol); }

function mostrar(id) {
  const p = porId[id] || porId[INICIO.dueno];
  const cambioRol = !actual || actual.rol !== p.rol;
  actual = p;
  imagen.src = 'pantallas/' + p.id + '.webp';
  imagen.alt = 'Pantalla: ' + p.titulo;
  marco.querySelectorAll('.zona').forEach((z) => z.remove());
  for (const [x, y, w, h, destino] of p.zonas) {
    if (!porId[destino]) continue;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'zona';
    b.style.cssText = 'left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%';
    b.setAttribute('aria-label', 'Ir a ' + porId[destino].titulo);
    b.addEventListener('click', (e) => { e.stopPropagation(); mostrar(destino); });
    marco.appendChild(b);
  }
  document.querySelectorAll('.roles button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.rol === p.rol)));
  if (cambioRol) {
    lista.innerHTML = delRol(p.rol).map((q) => '<option value="' + q.id + '">' + q.id.slice(0, 2) + ' · ' + q.titulo + '</option>').join('');
  }
  lista.value = p.id;
  if (location.hash !== '#p' + p.id.slice(0, 2)) history.replaceState(null, '', '#p' + p.id.slice(0, 2));
}

function mover(paso) {
  const grupo = delRol(actual.rol);
  const i = grupo.indexOf(actual);
  mostrar(grupo[(i + paso + grupo.length) % grupo.length].id);
}

// Precargar las imagenes para que el cambio de pantalla sea inmediato
PANTALLAS.forEach((p) => { const i = new Image(); i.src = 'pantallas/' + p.id + '.webp'; });

document.querySelectorAll('.roles button').forEach((b) => b.addEventListener('click', () => mostrar(INICIO[b.dataset.rol])));
document.getElementById('anterior').addEventListener('click', () => mover(-1));
document.getElementById('siguiente').addEventListener('click', () => mover(1));
lista.addEventListener('change', () => mostrar(lista.value));
document.getElementById('verZonas').addEventListener('change', (e) => marco.classList.toggle('mostrar', e.target.checked));
// Clic fuera de un boton: se resaltan un momento los que si se pueden tocar (como en Figma)
marco.addEventListener('click', () => {
  marco.classList.remove('destello');
  void marco.offsetWidth;
  marco.classList.add('destello');
});
document.addEventListener('keydown', (e) => {
  if (e.target === lista) return;
  if (e.key === 'ArrowRight') mover(1);
  if (e.key === 'ArrowLeft') mover(-1);
});
function desdeHash() {
  const n = location.hash.replace('#p', '');
  const p = PANTALLAS.find((q) => q.id.startsWith(n + '-'));
  mostrar(p ? p.id : INICIO.dueno);
}
window.addEventListener('hashchange', desdeHash);
desdeHash();
</script>
